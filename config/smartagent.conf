# SMARTAGENT configuration — all runtime endpoints live here, never hardcoded.
# Format: key = value (plain, hand-parsed; '#' comments; no quoting needed).
# Crates locate this file by walking up from the current dir to the repo root.
# Every value is overridable by a CLI flag or an env var.

# Workspaces root (relative to repo root) — subagent runs, sandbox scratch,
# per-workspace semantic DBs. All crates resolve workspace paths against this.
workspaces_dir = workspaces
# Default data dir (relative to repo root) for durable stores (semdb files, journals).
data_dir = data

# Embeddings (OpenAI-compatible /v1/embeddings), used by semdb / memory / rag.
embeddings_endpoint = 100.88.0.2:8081
embeddings_model    = embeddinggemma

# Notifications (ntfy protocol), used by notify.
ntfy_server = http://ntfy.sh

# Telegram Bot API bridge. Bot token is policy-gated in secrets as telegram_bot_token.
# Comma-separated chat ids allowed to interact with the bot.
telegram_allowed_chats = 50020485

# Self-hosted SearXNG instance, used by search.
searx_instance = http://127.0.0.1:8888

# AkurAI-Notes hosted MCP server. This is the priority destination for durable
# documentation about all repos and projects; local vault/docs are fallback or
# working-copy mirrors when the hosted notes MCP is unavailable.
mcp_akurai_notes_url = https://akurai-notes.olibuijr.com/mcp

# AkurAI-AgentBrowser service, used by browser.
browser_service = http://127.0.0.1:4818
browser_devtools = http://127.0.0.1:9222

# Voice endpoints (OpenAI-compatible), used by voice.
voice_stt_url = http://100.88.0.2:8081/v1/audio/transcriptions
voice_tts_url = http://100.88.0.2:8081/v1/audio/speech

# Gateway (meðvitund) — persistent agent service. See Plans/MEDVITUND.md.
# gateway_socket = .pi/gateway.sock     unix socket clients connect to
# gateway_agent  = main                 agent/session name (pi --session-id gw-<name>)
heartbeat_secs = 120

# semdb daemon — persistent, multi-threaded owner of every .semdb file. The
# `semdb` CLI is a thin client of it (no direct-file fallback: verbs error if it
# is down). Managed by supervise as the `semdb` service. Override with the
# SMARTAGENT_SEMDB_SOCKET env var (absolute path; used by tests for isolation).
# semdb_socket = .pi/semdb.sock         unix socket clients connect to

# Per-agent model overrides (gateway fleet): agent_model_<id with _> = provider/model
# Unset -> pi default model. Examples:
# agent_model_linus_torvalds = codex/gpt-5.5
# agent_model_grace_hopper = codex/gpt-5.4-mini
