# SMARTAGENT lifecycle hooks — see `hooks help` for the contract.
# Events: tool_call | tool_result | user_prompt | session_start | stop
# exit 0 = allow (stdout: JSON decision or plain-text context), exit 2 = BLOCK.

[hook]
name    = guard-destructive
event   = tool_call
matcher = sandbox
command = hooks.d/guard-destructive.sh
timeout = 5

# Kanban gate — file mutations require a task in `doing` (root board, or the
# workspace repo's own board for workspaces/<p>/ paths). Blocks with the exact
# unlock commands. Exempt: .scratch/, SMARTAGENT_HOOKS_RELAX=1.
[hook]
name    = require-doing-task-edit
event   = tool_call
matcher = edit
command = hooks.d/require-doing-task.sh
timeout = 5

[hook]
name    = require-doing-task-write
event   = tool_call
matcher = write
command = hooks.d/require-doing-task.sh
timeout = 5

# Live operating state injected at agent start (board / workflow / index).
[hook]
name    = session-brief
event   = session_start
command = hooks.d/session-brief.sh
timeout = 10

# Board snapshot in the audit trail at agent end.
[hook]
name    = stop-board-audit
event   = stop
command = hooks.d/stop-board-audit.sh
timeout = 5

# Self-heal loop: eval failures become board tasks at agent end (deduped;
# re-failure after a completed fix escalates to p1 instead of retrying).
[hook]
name    = eval-triage
event   = stop
command = hooks.d/eval-triage.sh
timeout = 10
