# SMARTAGENT lifecycle hooks — see `hooks help` for the contract.
# Events: tool_call | tool_result | user_prompt | session_start | stop
# exit 0 = allow (stdout: JSON decision or plain-text context), exit 2 = BLOCK.

[hook]
name    = guard-destructive
event   = tool_call
matcher = sandbox
command = hooks.d/guard-destructive.sh
timeout = 5
